spring.application.name=insurance-semantic-search
server.port=9090

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=insurance_db

# Spring AI MongoDB Vector Store
spring.ai.vectorstore.mongodb.index-name=insurance_vector_index
spring.ai.vectorstore.mongodb.collection-name=insurance_documents
spring.ai.vectorstore.mongodb.initialize-schema=false

# Google Gemini API
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Gemini Embedding Model
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

